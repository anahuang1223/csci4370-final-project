spring.application.name=DBFinalProject

# Local environment configuration
spring.config.import=optional:file:../.env[.properties]

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE:dbfinalproject}
spring.datasource.username=${DB_USERNAME:dbuser}
spring.datasource.password=${DB_PASSWORD:dbpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# Backend port
server.port=8080